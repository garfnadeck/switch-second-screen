[platformio]
default_envs = pico_w
;default_envs = emulator_mac ; Mude para esp32-s3-devkitc-1 quando a placa chegar

; =========================================================================
; AMBIENTE 1: Simulador Nativo no macOS (Janela 320x480 para desenvolver hoje)
; =========================================================================
[env:emulator_mac]
platform = native
build_flags =
    -std=c++17
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -DSDL_HOR_RES=480
    -DSDL_VER_RES=320
    -Iinclude
    -I"${platformio.include_dir}"
    -I.pio/libdeps/emulator_mac
    -I/opt/homebrew/include
    -I/opt/homebrew/include/SDL2
    -L/opt/homebrew/lib
    -lSDL2
lib_deps =
    lvgl/lvgl @ ^8.3.11
    lvgl/lv_drivers @ ^8.3.0

; =========================================================================
; AMBIENTE 2: Placa Física ESP32-S3 3.5" (N16R8 - 16MB Flash + 8MB PSRAM)
; =========================================================================
[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
lib_deps =
    lvgl/lvgl @ ^8.3.11
    lovyan03/LovyanGFX @ ^1.1.12

; =========================================================================
; AMBIENTE 3: Placa Física Raspberry Pi Pico W
; =========================================================================

[env:pico_w]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipicow
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 1m
build_flags =
    -std=c++17
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -DUSE_TINYUSB
    -Iinclude
    -DARDUINO_ARCH_RP2040
lib_deps =
    lvgl/lvgl @ ^8.4.0
    lovyan03/LovyanGFX @ ^1.2.34