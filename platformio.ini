[platformio]
default_envs = pico_w
;default_envs = emulator_mac ; Mude para esp32-s3-devkitc-1 quando a placa chegar

; =========================================================================
; AMBIENTE 1: Simulador Nativo no macOS (Janela 320x480 para desenvolver hoje)
; =========================================================================
[env:emulator_mac]
platform = native
build_flags =
    -std=c++17
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -DSDL_HOR_RES=480
    -DSDL_VER_RES=320
    -Iinclude
    -I"${platformio.include_dir}"
    -I.pio/libdeps/emulator_mac
    -I/opt/homebrew/include
    -I/opt/homebrew/include/SDL2
    -L/opt/homebrew/lib
    -lSDL2
lib_deps =
    lvgl/lvgl @ ^8.3.11
    lvgl/lv_drivers @ ^8.3.0

; =========================================================================
; AMBIENTE 2: Placa Física ESP32-S3 3.5" (N16R8 - 16MB Flash + 8MB PSRAM)
; -DHAS_DISPLAY liga o LVGL + tela no main.cpp (o Pico W de teste nao tem tela)
; =========================================================================
[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    -DHAS_DISPLAY
lib_deps =
    lvgl/lvgl @ ^8.3.11
    lovyan03/LovyanGFX @ ^1.1.12

; =========================================================================
; AMBIENTE 2b: ESP32-S3 sem tela (teste de rede e pagina web)
; Mesma placa, sem -DHAS_DISPLAY (o driver da ES3C35P ainda nao esta no firmware).
; A interface de teste e a pagina web: http://IP-da-placa/ no celular ou PC.
; Flash 16 MB (N16R8) e LittleFS, para o uploadfs gravar o formato que o firmware le.
; =========================================================================
[env:esp32-s3-web]
extends = env:esp32-s3-devkitc-1
board_build.filesystem = littlefs
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude

; AMBIENTE 2c: mesmo do esp32-s3-web, com o teste de bancada da tela (texto TESTE)
[env:esp32-s3-tela]
extends = env:esp32-s3-web
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    -DES3C35P_TELA_TESTE

; AMBIENTE 2d: ESP32-S3 com a HUD (LVGL) na tela. Sem toque ainda (entra no proximo PR).
[env:esp32-s3-hud]
extends = env:esp32-s3-web
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    -DHAS_DISPLAY

; =========================================================================
; AMBIENTE 2e: TESTE ISOLADO DO TOQUE (so diagnostico). Sem LVGL e sem Wi-Fi: mesmo caminho da bancada.
; Barra azul no topo = leitura sem erro; vermelha = erro do I2C. Cada toque deixa um quadrado verde.
[env:esp32-s3-touch-isolado]
extends = env:esp32-s3-web
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    -DTOUCH_ISOLADO

; =========================================================================
; AMBIENTE 3: Placa Física Raspberry Pi Pico W
; =========================================================================

[env:pico_w]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipicow
framework = arduino
board_build.core = earlephilhower
board_build.filesystem = littlefs
board_build.filesystem_size = 1m
build_flags =
    -std=c++17
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -DUSE_TINYUSB
    -Iinclude
    -DARDUINO_ARCH_RP2040
lib_deps =
    lvgl/lvgl @ ^8.4.0
    lovyan03/LovyanGFX @ ^1.2.34